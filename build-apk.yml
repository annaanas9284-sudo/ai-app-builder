name: Build APK

# The app builder starts this workflow for you. You can also start it by hand
# from the "Actions" tab if a file builds/<build_id>.json exists.
run-name: Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build id (a file builds/<build_id>.json must exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Android project
        run: |
          case "$BUILD_ID" in
            *[!A-Za-z0-9-]*|"") echo "ERROR: invalid build id"; exit 1 ;;
          esac
          node scripts/prepare-android.js "builds/${BUILD_ID}.json" out/android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: out/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: out/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
